name: Cloudflare dev CD

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_CD_CONFIG:
        required: true
      CLOUDFLARE_APP_SECRETS:
        required: true
      CLOUDFLARE_ACCESS_CLIENT_ID:
        required: true
      CLOUDFLARE_ACCESS_CLIENT_SECRET:
        required: true
      CLOUDFLARE_DATABASE_URL:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-dev
    # 実行中の配備・検証を中断しない。待機順には依存せず、実行直前に最新SHAを照合する。
    concurrency:
      group: cloudflare-dev-deployment
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Prepare private runner directory
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/hono-cloudflare-dev-cd"
          printf 'CLOUDFLARE_CD_DIR=%s/hono-cloudflare-dev-cd\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout deployment SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Deploy and verify protected application
        run: bun --no-env-file scripts/cloudflare-cd.mjs deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_CD_CONFIG: ${{ secrets.CLOUDFLARE_CD_CONFIG }}
          CLOUDFLARE_APP_SECRETS: ${{ secrets.CLOUDFLARE_APP_SECRETS }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_DATABASE_URL: ${{ secrets.CLOUDFLARE_DATABASE_URL }}

      - name: Remove private temporary files
        if: always()
        run: rm -rf -- "$CLOUDFLARE_CD_DIR" "$HOME/.config/.wrangler" .wrangler scripts/cloudflare-app/.wrangler
