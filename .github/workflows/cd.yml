name: Main CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  aws:
    needs: ci
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-aws.yml
    secrets:
      IAM_ARN_TO_PUSH_IMAGE: ${{ secrets.IAM_ARN_TO_PUSH_IMAGE }}

  shared-dev:
    needs: ci
    if: vars.GCP_DEV_CD_ENABLED == 'true' || vars.CLOUDFLARE_DEV_CD_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-shared-dev.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_CD_CONFIG: ${{ secrets.CLOUDFLARE_CD_CONFIG }}
      CLOUDFLARE_APP_SECRETS: ${{ secrets.CLOUDFLARE_APP_SECRETS }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_DATABASE_URL: ${{ secrets.CLOUDFLARE_DATABASE_URL }}
