name: Shared dev database migration

on:
  workflow_call:
    outputs:
      migrated-sha:
        value: ${{ jobs.migrate.outputs.sha }}
      migrated-attempt:
        value: ${{ jobs.migrate.outputs.attempt }}

jobs:
  migrate:
    outputs:
      attempt: ${{ steps.migrated.outputs.attempt }}
      sha: ${{ steps.migrated.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: gcp-dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_WORKSPACE: dev
    steps:
      - name: Checkout deployment SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare private runner directories
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/hono-gcp-dev-cd" "$RUNNER_TEMP/hono-gcp-dev-docker"
          printf 'GCP_CD_DIR=%s/hono-gcp-dev-cd\nCLOUDSDK_CONFIG=%s/hono-gcp-dev-gcloud\nDOCKER_CONFIG=%s/hono-gcp-dev-docker\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime before cloud authentication
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: hono-cd:runtime
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=gcp-runtime
          cache-to: type=gha,scope=gcp-runtime,mode=max

      - name: Build migration before cloud authentication
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migration
          platforms: linux/amd64
          load: true
          tags: hono-cd:migration
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=gcp-migration
          cache-to: type=gha,scope=gcp-migration,mode=max

      - name: Verify built images with disposable database
        run: bun run test:container
        env:
          VERIFY_RUNTIME_IMAGE: hono-cd:runtime
          VERIFY_MIGRATION_IMAGE: hono-cd:migration

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Prepare local CLI configuration
        run: |
          umask 077
          mkdir -p "$CLOUDSDK_CONFIG"
          gcloud --configuration=hono-app-dev config configurations create hono-app-dev --no-activate --quiet

      - name: Authenticate migration only
        uses: google-github-actions/auth@v3
        with:
          project_id: hono-app-dev-512908-f3
          workload_identity_provider: projects/669070496198/locations/global/workloadIdentityPools/hono-app-dev-github/providers/github
          service_account: hono-app-dev-cd-migration@hono-app-dev-512908-f3.iam.gserviceaccount.com

      - name: Apply pending migrations and verify database
        run: bun scripts/gcp-cd.mjs migrate

      - name: Record successful migration
        id: migrated
        run: |
          printf 'attempt=%s\nsha=%s\n' "$GITHUB_RUN_ATTEMPT" "$(cat "$GCP_CD_DIR/migration-ok")" >> "$GITHUB_OUTPUT"

      - name: Remove private temporary files
        if: always()
        run: rm -rf -- "$GCP_CD_DIR" "$CLOUDSDK_CONFIG" "$DOCKER_CONFIG"
