# cspell:words pinentry
name: GCP dev CD

on:
  workflow_call:
    inputs:
      prepare:
        type: boolean
        required: true
      migrated-sha:
        type: string
    outputs:
      prepared-attempt:
        value: ${{ jobs.prepare.outputs.attempt }}

jobs:
  prepare:
    if: inputs.prepare
    outputs:
      attempt: ${{ steps.prepared.outputs.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: gcp-dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_WORKSPACE: dev
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Checkout deployment SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare private runner directories
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/hono-gcp-dev-cd" "$RUNNER_TEMP/hono-gcp-dev-docker"
          printf 'GCP_CD_DIR=%s/hono-gcp-dev-cd\nTF_DATA_DIR=%s/hono-gcp-dev-terraform\nCLOUDSDK_CONFIG=%s/hono-gcp-dev-gcloud\nDOCKER_CONFIG=%s/hono-gcp-dev-docker\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime before cloud authentication
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: hono-cd:runtime
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=gcp-runtime
          cache-to: type=gha,scope=gcp-runtime,mode=max

      - name: Build migration before cloud authentication
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migration
          platforms: linux/amd64
          load: true
          tags: hono-cd:migration
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=gcp-migration
          cache-to: type=gha,scope=gcp-migration,mode=max

      - name: Verify built images with disposable database
        run: bun run test:container
        env:
          VERIFY_RUNTIME_IMAGE: hono-cd:runtime
          VERIFY_MIGRATION_IMAGE: hono-cd:migration

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Prepare local CLI configuration
        run: |
          umask 077
          mkdir -p "$GCP_CD_DIR" "$DOCKER_CONFIG"
          gcloud --configuration=hono-app-dev config configurations create hono-app-dev --no-activate --quiet

      - name: Authenticate image publication and plan
        id: publication-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: hono-app-dev-512908-f3
          workload_identity_provider: projects/669070496198/locations/global/workloadIdentityPools/hono-app-dev-github/providers/github
          service_account: hono-app-dev-cd-deploy@hono-app-dev-512908-f3.iam.gserviceaccount.com
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.publication-auth.outputs.access_token }}

      - name: Push runtime only
        run: |
          image="asia-northeast1-docker.pkg.dev/hono-app-dev-512908-f3/hono-app-dev/hono:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag hono-cd:runtime "$image"
          docker push "$image"

      - name: Validate complete Terraform plan
        run: bun scripts/gcp-cd.mjs plan

      - name: Encrypt validated plan
        env:
          PLAN_KEY: ${{ secrets.GCP_CD_PLAN_KEY }}
        run: |
          test -n "$PLAN_KEY"
          tar -C "$GCP_CD_DIR" -cf "$GCP_CD_DIR/plan.tar" release.tfplan release.json
          printf '%s\n' "$PLAN_KEY" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$GCP_CD_DIR/plan.gpg" "$GCP_CD_DIR/plan.tar"

      - name: Upload encrypted plan
        uses: actions/upload-artifact@v4
        with:
          name: gcp-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GCP_CD_DIR }}/plan.gpg
          retention-days: 1
          if-no-files-found: error

      - name: Record successful preparation
        id: prepared
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Remove private temporary files
        if: always()
        run: rm -rf -- "$GCP_CD_DIR" "$TF_DATA_DIR" "$CLOUDSDK_CONFIG" "$DOCKER_CONFIG"

  deploy:
    if: '!inputs.prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: gcp-dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_WORKSPACE: dev
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Checkout deployment SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare private runner directories
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/hono-gcp-dev-cd" "$RUNNER_TEMP/hono-gcp-dev-docker"
          printf 'GCP_CD_DIR=%s/hono-gcp-dev-cd\nTF_DATA_DIR=%s/hono-gcp-dev-terraform\nCLOUDSDK_CONFIG=%s/hono-gcp-dev-gcloud\nDOCKER_CONFIG=%s/hono-gcp-dev-docker\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Prepare local CLI configuration
        run: |
          umask 077
          mkdir -p "$GCP_CD_DIR" "$DOCKER_CONFIG"
          gcloud --configuration=hono-app-dev config configurations create hono-app-dev --no-activate --quiet

      - name: Download encrypted plan
        uses: actions/download-artifact@v4
        with:
          name: gcp-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GCP_CD_DIR }}

      - name: Restore validated plan
        env:
          PLAN_KEY: ${{ secrets.GCP_CD_PLAN_KEY }}
        run: |
          test -n "$PLAN_KEY"
          printf '%s\n' "$PLAN_KEY" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --output "$GCP_CD_DIR/plan.tar" --decrypt "$GCP_CD_DIR/plan.gpg"
          tar -C "$GCP_CD_DIR" -xf "$GCP_CD_DIR/plan.tar" release.tfplan release.json

      - name: Refresh deployment authentication
        uses: google-github-actions/auth@v3
        with:
          project_id: hono-app-dev-512908-f3
          workload_identity_provider: projects/669070496198/locations/global/workloadIdentityPools/hono-app-dev-github/providers/github
          service_account: hono-app-dev-cd-deploy@hono-app-dev-512908-f3.iam.gserviceaccount.com

      - name: Apply saved plan and verify revision
        env:
          GCP_CD_MIGRATED_SHA: ${{ inputs.migrated-sha }}
        run: bun scripts/gcp-cd.mjs apply

      - name: Authenticate IAP verification only
        id: iap-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: hono-app-dev-512908-f3
          workload_identity_provider: projects/669070496198/locations/global/workloadIdentityPools/hono-app-dev-github/providers/github
          service_account: hono-app-dev-cd-verify@hono-app-dev-512908-f3.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: openid,https://www.googleapis.com/auth/userinfo.email

      - name: Verify IAP protection and authenticated health
        run: bun scripts/gcp-cd.mjs verify
        env:
          IAP_ACCESS_TOKEN: ${{ steps.iap-auth.outputs.access_token }}

      - name: Authenticate release retention
        uses: google-github-actions/auth@v3
        with:
          project_id: hono-app-dev-512908-f3
          workload_identity_provider: projects/669070496198/locations/global/workloadIdentityPools/hono-app-dev-github/providers/github
          service_account: hono-app-dev-cd-deploy@hono-app-dev-512908-f3.iam.gserviceaccount.com

      - name: Retain current and previous release
        run: bun scripts/gcp-cd.mjs cleanup

      - name: Remove private temporary files
        if: always()
        run: rm -rf -- "$GCP_CD_DIR" "$TF_DATA_DIR" "$CLOUDSDK_CONFIG" "$DOCKER_CONFIG"
